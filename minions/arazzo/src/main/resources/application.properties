# Configuration file.
quarkus.http.port=8082

# Configure the log level.
quarkus.log.level=INFO
quarkus.log.console.level=INFO

# Access to Microcks: the minion reports the results of runs to it, and calls its mocks.
microcks.url=http://localhost:8080
quarkus.rest-client.microcks-api.url=${microcks.url}
