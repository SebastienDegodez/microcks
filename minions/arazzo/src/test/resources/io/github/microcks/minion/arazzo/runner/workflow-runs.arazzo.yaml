# example: pastry-scenarios - the workflows of the story, as in API Pastry scenarios 1.0.0
arazzo: 1.0.1
info:
  title: API Pastry scenarios
  version: 1.0.0
sourceDescriptions:
  - name: pastryApi
    url: ./APIPastry-openapi.yaml
    type: openapi
workflows:
  - workflowId: readThenReprice
    summary: Reads a pastry, then changes its price using the name returned by the first call.
    inputs:
      type: object
      properties:
        pastry:
          type: string
        newPrice:
          type: number
    steps:
      - stepId: readPastry
        operationId: GetPastryByName
        parameters:
          - name: name
            in: path
            value: $inputs.pastry
          - name: Accept
            in: header
            value: application/json
        successCriteria:
          - condition: $statusCode == 200 && $response.body#/status == 'available'
        outputs:
          name: $response.body#/name
          price: $response.body#/price
      - stepId: reprice
        operationId: $sourceDescriptions.pastryApi.PatchPastry
        parameters:
          - name: name
            in: path
            value: $steps.readPastry.outputs.name
          - name: Accept
            in: header
            value: application/json
        requestBody:
          contentType: application/json
          payload:
            price: 0
          replacements:
            - target: /price
              value: $inputs.newPrice
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/price == $inputs.newPrice
        outputs:
          price: $response.body#/price
    outputs:
      before: $steps.readPastry.outputs.price
      after: $steps.reprice.outputs.price
  - workflowId: listThenReadFirst
    summary: Reads the first pastry of the list.
    steps:
      - stepId: list
        operationId: GetPastries
        parameters:
          - name: size
            in: query
            value: S
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          first: $response.body#/0/name
      - stepId: readFirst
        operationId: GetPastryByName
        parameters:
          - name: name
            in: path
            value: $steps.list.outputs.first
        successCriteria:
          - condition: $statusCode == 200
---
# example: not-run-after-failure - a step after the failing one is not executed
arazzo: 1.0.1
info:
  title: API Pastry repricing
  version: 1.0.0
sourceDescriptions:
  - name: pastryApi
    url: ./APIPastry-openapi.yaml
    type: openapi
workflows:
  - workflowId: listReadFirstThenReprice
    steps:
      - stepId: list
        operationId: GetPastries
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          first: $response.body#/0/name
      - stepId: readFirst
        operationId: GetPastryByName
        parameters:
          - name: name
            in: path
            value: $steps.list.outputs.first
        successCriteria:
          - condition: $statusCode == 200
      - stepId: reprice
        operationId: PatchPastry
        parameters:
          - name: name
            in: path
            value: $steps.list.outputs.first
        successCriteria:
          - condition: $statusCode == 200
---
# example: unexecutable - steps and outputs whose runtime expressions have no value
arazzo: 1.0.1
info:
  title: API Pastry mistakes
  version: 1.0.0
sourceDescriptions:
  - name: pastryApi
    url: ./APIPastry-openapi.yaml
    type: openapi
workflows:
  - workflowId: missingInput
    steps:
      - stepId: readPastry
        operationId: GetPastryByName
        parameters:
          - name: name
            in: path
            value: $inputs.pastry
        successCriteria:
          - condition: $statusCode == 200
  - workflowId: missingOutput
    steps:
      - stepId: list
        operationId: GetPastries
        successCriteria:
          - condition: $statusCode == 200
    outputs:
      first: $steps.list.outputs.first
  - workflowId: textBodyCriterion
    steps:
      - stepId: readMissing
        operationId: GetPastryByName
        parameters:
          - name: name
            in: path
            value: Baba Rhum
        successCriteria:
          - condition: $response.body#/status == 'available'
  - workflowId: textPayload
    steps:
      - stepId: reprice
        operationId: PatchPastry
        parameters:
          - name: name
            in: path
            value: Eclair Cafe
        requestBody:
          contentType: text/plain
          payload: price is 2.6
        successCriteria:
          - condition: $statusCode == 200
---
# example: regex-criterion - a criterion matching a header of the response with a regular expression
arazzo: 1.0.1
info:
  title: API Pastry headers
  version: 1.0.0
sourceDescriptions:
  - name: pastryApi
    url: ./APIPastry-openapi.yaml
    type: openapi
workflows:
  - workflowId: readJson
    steps:
      - stepId: readPastry
        operationId: GetPastryByName
        parameters:
          - name: name
            in: path
            value: Eclair Cafe
        successCriteria:
          - context: $response.header.content-type
            condition: ^application/json
            type: regex
          - context: $response.header.Content-Type
            condition: xml
            type: regex
