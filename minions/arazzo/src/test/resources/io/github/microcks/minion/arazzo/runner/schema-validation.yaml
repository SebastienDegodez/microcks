# example: pastry-journeys - readThenReprice, whose reprice step only checks its status, readOnly and listOnly
arazzo: 1.0.1
info:
  title: API Pastry journeys
  version: 1.0.0
sourceDescriptions:
  - name: pastryApi
    url: ./APIPastry-openapi.yaml
    type: openapi
workflows:
  - workflowId: readThenReprice
    inputs:
      type: object
      properties:
        pastry:
          type: string
        newPrice:
          type: number
    steps:
      - stepId: readPastry
        operationId: GetPastryByName
        parameters:
          - name: name
            in: path
            value: $inputs.pastry
          - name: Accept
            in: header
            value: application/json
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          name: $response.body#/name
      - stepId: reprice
        operationId: PatchPastry
        parameters:
          - name: name
            in: path
            value: $steps.readPastry.outputs.name
          - name: Accept
            in: header
            value: application/json
        requestBody:
          contentType: application/json
          payload:
            price: 0
          replacements:
            - target: /price
              value: $inputs.newPrice
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          price: $response.body#/price
    outputs:
      after: $steps.reprice.outputs.price
  - workflowId: readOnly
    inputs:
      type: object
      properties:
        pastry:
          type: string
    steps:
      - stepId: readPastry
        operationId: GetPastryByName
        parameters:
          - name: name
            in: path
            value: $inputs.pastry
        successCriteria:
          - condition: $statusCode != 0
  - workflowId: listOnly
    steps:
      - stepId: list
        operationId: GetPastries
        successCriteria:
          - condition: $statusCode == 200
---
# example: api-pastry-contract - the OpenAPI contract of API Pastry - 2.0, where the price of a Pastry is a number
openapi: 3.0.2
info:
  title: API Pastry - 2.0
  version: 2.0.0
paths:
  /pastry:
    get:
      operationId: GetPastries
      responses:
        "200":
          description: Pastries, inline, whose content type is written with its charset
          content:
            application/json;charset=UTF-8:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pastry'
  /pastry/{name}:
    get:
      operationId: GetPastryByName
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pastry with specified name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pastry'
        "202":
          description: Accepted, with any body
          content:
            application/json: {}
        "404":
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: PatchPastry
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pastry'
      responses:
        "200":
          description: Changed pastry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pastry'
components:
  responses:
    NotFound:
      description: No pastry with this name
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Pastry:
      type: object
      properties:
        name:
          type: string
        size:
          type: string
        price:
          format: double
          type: number
        status:
          type: string
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
---
# example: api-pastry-swagger-contract - the Swagger 2 contract of API Pastry - 1.0, where the price of a Pastry is a number
swagger: "2.0"
info:
  title: API Pastry - 1.0
  version: 1.0.0
paths:
  /pastry/{name}:
    get:
      operationId: GetPastryByName
      produces:
        - application/json
      parameters:
        - name: name
          in: path
          required: true
          type: string
      responses:
        "200":
          description: Pastry with specified name
          schema:
            $ref: '#/definitions/Pastry'
        "202":
          description: Accepted, with any body
        "404":
          $ref: '#/responses/NotFound'
responses:
  NotFound:
    description: No pastry with this name
    schema:
      $ref: '#/definitions/Error'
definitions:
  Pastry:
    type: object
    properties:
      name:
        type: string
      size:
        type: string
      price:
        format: double
        type: number
      status:
        type: string
  Error:
    type: object
    required:
      - message
    properties:
      message:
        type: string
---
