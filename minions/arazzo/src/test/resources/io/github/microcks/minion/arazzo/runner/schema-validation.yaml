# example: non-conformant-mocks - API Pastry whose PatchPastry example answers a price as a string, against its Pastry schema
openapi: 3.0.2
info:
  title: API Pastry - non-conformant
  version: 2.0.0
paths:
  /pastry/{name}:
    get:
      operationId: GetPastryByName
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          examples:
            Eclair Cafe:
              value: Eclair Cafe
      responses:
        "200":
          description: Pastry with specified name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pastry'
              examples:
                Eclair Cafe:
                  value:
                    name: Eclair Cafe
                    size: M
                    price: 2.5
                    status: available
    patch:
      operationId: PatchPastry
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          examples:
            Eclair Cafe:
              value: Eclair Cafe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pastry'
            examples:
              Eclair Cafe:
                value:
                  price: 2.6
      responses:
        "200":
          description: Changed pastry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pastry'
              examples:
                Eclair Cafe:
                  value:
                    price: "2.6"
components:
  schemas:
    Pastry:
      type: object
      properties:
        name:
          type: string
        size:
          type: string
        price:
          format: double
          type: number
        status:
          type: string
