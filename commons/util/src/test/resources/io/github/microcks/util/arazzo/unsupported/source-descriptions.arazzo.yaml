# Source descriptions of a type the workflow runner does not call yet. One YAML document per example.
# example: asyncapi - an AsyncAPI description next to an OpenAPI one
arazzo: 1.0.1
info:
  title: Order scenarios
  version: 1.0.0
sourceDescriptions:
  - name: orderApi
    url: ./order-api.openapi.yaml
  - name: orderEvents
    url: ./order-events.asyncapi.yaml
    type: asyncapi
workflows:
  - workflowId: placeOrder
    steps:
      - stepId: createOrder
        operationId: CreateOrder
