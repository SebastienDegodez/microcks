# operationIds Arazzo forbids. One YAML document per example.
# example: lone-operation-id - an operationId that does not name its source while there are several source descriptions
arazzo: 1.0.1
info:
  title: Order fulfilment
  version: 1.0.0
sourceDescriptions:
  - name: customerApi
    url: ./customer-api.openapi.yaml
    type: openapi
  - name: orderApi
    url: ./order-api.openapi.yaml
    type: openapi
workflows:
  - workflowId: placeOrder
    steps:
      - stepId: readCustomer
        operationId: $sourceDescriptions.customerApi.GetCustomer
      - stepId: createOrder
        operationId: CreateOrder
