# example: channel-of-unknown-source - the channelPath of the step confirmOrder names a source the document does not declare
arazzo: 1.1.0
info:
  title: Order events scenarios
  version: 1.0.0
sourceDescriptions:
  - name: orderEvents
    url: ./order-events.asyncapi.yaml
    type: asyncapi
workflows:
  - workflowId: listen
    steps:
      - stepId: confirmOrder
        channelPath: '{$sourceDescriptions.unknown.url}#/channels/orderConfirmed'
