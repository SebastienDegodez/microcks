---
# example: operation-and-channel - the step confirmOrder names both an operation and a channel
arazzo: 1.1.0
info:
  title: Order events scenarios
  version: 1.0.0
sourceDescriptions:
  - name: orderEvents
    url: ./order-events.asyncapi.yaml
    type: asyncapi
workflows:
  - workflowId: listen
    steps:
      - stepId: confirmOrder
        operationId: receiveOrderConfirmed
        channelPath: '{$sourceDescriptions.orderEvents.url}#/channels/orderConfirmed'
        action: receive
---
# example: not-a-channel - the channelPath of the step confirmOrder points to an operation rather than a channel
arazzo: 1.1.0
info:
  title: Order events scenarios
  version: 1.0.0
sourceDescriptions:
  - name: orderEvents
    url: ./order-events.asyncapi.yaml
