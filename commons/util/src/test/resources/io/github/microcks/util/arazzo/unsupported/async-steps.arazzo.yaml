# Steps sending or receiving messages in a way Arazzo 1.1 forbids, or that Microcks cannot read. One YAML document
# per example.
# example: action-on-http-step - the HTTP step createOrder tells an action, that only applies to an AsyncAPI step
arazzo: 1.1.0
info:
  title: Order events scenarios
  version: 1.0.0
sourceDescriptions:
  - name: orderApi
    url: ./order-api.openapi.yaml
    type: openapi
workflows:
  - workflowId: placeOrder
    steps:
      - stepId: createOrder
        operationId: CreateOrder
        action: send
---
# example: correlation-id-on-http-step - the HTTP step createOrder has a correlationId, that only applies to an AsyncAPI step
arazzo: 1.1.0
info:
  title: Order events scenarios
  version: 1.0.0
sourceDescriptions:
  - name: orderApi
    url: ./order-api.openapi.yaml
    type: openapi
workflows:
  - workflowId: placeOrder
    steps:
      - stepId: createOrder
        operationId: CreateOrder
        correlationId: $inputs.orderId
---
# example: channel-path-to-openapi - the channelPath of the step createOrder points into an OpenAPI source
arazzo: 1.1.0
info:
  title: Order events scenarios
  version: 1.0.0
sourceDescriptions:
  - name: orderApi
    url: ./order-api.openapi.yaml
    type: openapi
workflows:
  - workflowId: placeOrder
    steps:
      - stepId: createOrder
        channelPath: '{$sourceDescriptions.orderApi.url}#/channels/orders'
        action: send
---
# example: unknown-action - the step confirmOrder tells an action that is neither send nor receive
arazzo: 1.1.0
info:
  title: Order events scenarios
  version: 1.0.0
sourceDescriptions:
  - name: orderEvents
    url: ./order-events.asyncapi.yaml
    type: asyncapi
workflows:
  - workflowId: listen
    steps:
      - stepId: confirmOrder
        operationId: receiveOrderConfirmed
        action: subscribe
---
# example: correlation-id-on-send - the step requestShipping sends a message and has a correlationId, that only a receive step has
arazzo: 1.1.0
info:
  title: Order events scenarios
  version: 1.0.0
sourceDescriptions:
  - name: orderEvents
    url: ./order-events.asyncapi.yaml
    type: asyncapi
workflows:
  - workflowId: ship
    steps:
      - stepId: requestShipping
        operationId: sendShippingRequest
        action: send
        correlationId: $inputs.orderId
---
# example: negative-timeout - the step confirmOrder waits a negative number of milliseconds
arazzo: 1.1.0
info:
  title: Order events scenarios
  version: 1.0.0
sourceDescriptions:
  - name: orderEvents
    url: ./order-events.asyncapi.yaml
    type: asyncapi
workflows:
  - workflowId: listen
    steps:
      - stepId: confirmOrder
        operationId: receiveOrderConfirmed
        action: receive
        timeout: -1
---
# example: text-timeout - the step confirmOrder waits a text rather than a number of milliseconds
arazzo: 1.1.0
info:
  title: Order events scenarios
