# example: decimal-timeout - the step confirmOrder waits a fraction of a millisecond
arazzo: 1.1.0
info:
  title: Order events scenarios
  version: 1.0.0
sourceDescriptions:
  - name: orderEvents
    url: ./order-events.asyncapi.yaml
