# example: cycle - checkAccount and bodacc depend on each other through sirene; first and synthesis are out of the cycle
arazzo: 1.1.0
info:
  title: Company check
  version: 1.0.0
sourceDescriptions:
  - name: companyApi
    url: ./company-api.openapi.yaml
workflows:
  - workflowId: checkCompany
    steps:
      - stepId: first
        operationId: getAccount
      - stepId: checkAccount
        operationId: getAccount
        dependsOn:
          - first
          - bodacc
      - stepId: sirene
        operationId: getSirene
        dependsOn:
          - checkAccount
      - stepId: bodacc
        operationId: getBodacc
        dependsOn:
          - sirene
      - stepId: synthesis
        operationId: postSynthesis
