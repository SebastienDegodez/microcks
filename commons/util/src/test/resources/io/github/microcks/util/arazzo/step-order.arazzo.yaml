# The order of the steps of a workflow: the steps a step must come after. One YAML document per example.
# example: parallel - three steps only need checkAccount, as the story tells, and synthesis needs all the others
arazzo: 1.1.0
info:
  title: Company check
  version: 1.0.0
sourceDescriptions:
  - name: companyApi
    url: ./company-api.openapi.yaml
workflows:
  - workflowId: checkCompany
    steps:
      - stepId: checkAccount
        operationId: getAccount
        outputs:
          siren: $response.body#/siren
      - stepId: sirene
        operationId: getSirene
        dependsOn:
          - checkAccount
      - stepId: bodacc
        operationId: getBodacc
        dependsOn:
          - checkAccount
      - stepId: financials
        operationId: getFinancials
        dependsOn:
          - checkAccount
      - stepId: synthesis
        operationId: postSynthesis
---
# example: implicit - financials names sirene, and uses the outputs of checkAccount without naming it
arazzo: 1.1.0
info:
  title: Company check
  version: 1.0.0
sourceDescriptions:
  - name: companyApi
    url: ./company-api.openapi.yaml
workflows:
  - workflowId: checkCompany
    steps:
      - stepId: checkAccount
        operationId: getAccount
        outputs:
          siren: $response.body#/siren
      - stepId: sirene
        operationId: getSirene
        dependsOn:
          - checkAccount
        outputs:
          name: $response.body#/name
      - stepId: bodacc
        operationId: getBodacc
        dependsOn:
          - checkAccount
      - stepId: financials
        operationId: getFinancials
        dependsOn:
          - sirene
        parameters:
          - name: siren
            in: path
            value: $steps.checkAccount.outputs.siren
        outputs:
          own: $steps.financials.outputs.ratio
          ratio: $response.body#/ratio
---
# example: every-place - each step uses the outputs of another one in a different place of a step
arazzo: 1.1.0
info:
  title: Company check
  version: 1.0.0
sourceDescriptions:
  - name: companyApi
    url: ./company-api.openapi.yaml
workflows:
  - workflowId: checkCompany
    steps:
      - stepId: checkAccount
        operationId: getAccount
        outputs:
          siren: $response.body#/siren
      - stepId: inPayload
        operationId: postSynthesis
        dependsOn: []
        requestBody:
          payload: '{"siren": "{$steps.checkAccount.outputs.siren}"}'
      - stepId: inReplacement
        operationId: postSynthesis
        dependsOn: []
        requestBody:
          payload:
            siren: ''
          replacements:
            - target: /siren
              value: $steps.checkAccount.outputs.siren
      - stepId: inCriterion
        operationId: getSirene
        dependsOn: []
        successCriteria:
          - condition: $response.body#/siren == $steps.checkAccount.outputs.siren
      - stepId: inContext
        operationId: getSirene
        dependsOn: []
        successCriteria:
          - context: $steps.checkAccount.outputs.siren
            condition: ^[0-9]+$
            type: regex
      - stepId: inActionCriterion
        operationId: getSirene
        dependsOn: []
        onFailure:
          - name: giveUp
            type: end
            criteria:
              - condition: $steps.checkAccount.outputs.siren == ''
      - stepId: inOutput
        operationId: getSirene
        dependsOn: []
        outputs:
          siren: $steps.checkAccount.outputs.siren
      - stepId: alone
        operationId: getSirene
        dependsOn: []
        parameters:
          - name: siren
            in: path
            value: '123456789'
---
# example: in-correlation-id - a receive step uses the outputs of an earlier step as its correlationId
arazzo: 1.1.0
info:
  title: Company events
  version: 1.0.0
sourceDescriptions:
  - name: companyApi
    url: ./company-api.openapi.yaml
  - name: companyEvents
    url: ./company-events.asyncapi.yaml
    type: asyncapi
workflows:
  - workflowId: listen
    steps:
      - stepId: checkAccount
        operationId: $sourceDescriptions.companyApi.getAccount
        outputs:
          siren: $response.body#/siren
      - stepId: register
        operationId: $sourceDescriptions.companyApi.postSynthesis
      - stepId: registered
        operationId: $sourceDescriptions.companyEvents.receiveRegistered
        action: receive
        correlationId: $steps.checkAccount.outputs.siren
        dependsOn: []
---
# example: sequential - an Arazzo 1.0.1 workflow without dependsOn: each step comes after all the previous ones
arazzo: 1.0.1
info:
  title: Company check
  version: 1.0.0
sourceDescriptions:
  - name: companyApi
    url: ./company-api.openapi.yaml
workflows:
  - workflowId: checkCompany
    steps:
      - stepId: checkAccount
        operationId: getAccount
      - stepId: sirene
        operationId: getSirene
      - stepId: synthesis
        operationId: postSynthesis
---
# example: forward-use-without-depends-on - without dependsOn, a step using the outputs of a later one is read as before
arazzo: 1.0.1
info:
  title: Company check
  version: 1.0.0
sourceDescriptions:
  - name: companyApi
    url: ./company-api.openapi.yaml
workflows:
  - workflowId: checkCompany
    steps:
      - stepId: checkAccount
        operationId: getAccount
        parameters:
          - name: siren
            in: path
            value: $steps.sirene.outputs.siren
      - stepId: sirene
        operationId: getSirene
        outputs:
          siren: $response.body#/siren
