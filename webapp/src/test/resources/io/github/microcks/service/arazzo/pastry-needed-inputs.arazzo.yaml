arazzo: 1.0.1
info:
  title: API Pastry scenarios
  version: 1.0.0
sourceDescriptions:
  - name: pastryApi
    url: ./APIPastry-openapi.yaml
    type: openapi
workflows:
  - workflowId: readAndTell
    summary: Reads a pastry for a customer, requiring a note, and tells the label given back.
    inputs:
      type: object
      required:
        - note
      properties:
        pastry:
          type: string
        note:
          type: string
        comment:
          type: string
    steps:
      - stepId: readPastry
        operationId: GetPastryByName
        parameters:
          - name: name
            in: path
            value: $inputs.pastry
        successCriteria:
          - condition: $statusCode == 200
    outputs:
      told: $inputs.label
