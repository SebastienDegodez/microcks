# example: order-saga - Order saga 1.0.0: placeOrderSaga creates, reserves, charges, then confirms an order
arazzo: 1.0.1
info:
  title: Order saga
  version: 1.0.0
sourceDescriptions:
  - name: orderApi
    url: ./order-api.yaml
    type: openapi
  - name: stockApi
    url: ./stock-api.yaml
    type: openapi
  - name: paymentApi
    url: ./payment-api.yaml
    type: openapi
workflows:
  - workflowId: placeOrderSaga
    summary: Places an order, reserves its items, charges it, then confirms it.
    inputs:
      type: object
      properties:
        customerId:
          type: string
    steps:
      - stepId: createOrder
        operationId: $sourceDescriptions.orderApi.createOrder
        requestBody:
          contentType: application/json
          payload:
            customerId: ""
            items:
              - sku: ABC-1
                quantity: 2
            amount: 25.0
            currency: EUR
          replacements:
            - target: /customerId
              value: $inputs.customerId
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          id: $response.body#/id
          amount: $response.body#/amount
      - stepId: reserveStock
        operationId: $sourceDescriptions.stockApi.reserveStock
        requestBody:
          contentType: application/json
          payload:
            orderId: ""
            items:
              - sku: ABC-1
                quantity: 2
          replacements:
            - target: /orderId
              value: $steps.createOrder.outputs.id
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          reservationId: $response.body#/id
      - stepId: chargePayment
        operationId: $sourceDescriptions.paymentApi.chargePayment
        requestBody:
          contentType: application/json
          payload:
            orderId: ""
            amount: 0
          replacements:
            - target: /orderId
              value: $steps.createOrder.outputs.id
            - target: /amount
              value: $steps.createOrder.outputs.amount
        successCriteria:
          - condition: $statusCode == 201
      - stepId: confirmOrder
        operationId: $sourceDescriptions.orderApi.confirmOrder
        parameters:
          - name: orderId
            in: path
            value: $steps.createOrder.outputs.id
        successCriteria:
          - condition: $statusCode == 200
    outputs:
      orderId: $steps.createOrder.outputs.id
      reservationId: $steps.reserveStock.outputs.reservationId
---
# example: order-saga-sources - links the sources of Order saga 1.0.0 to Order, Stock and Payment API 1.0.0
apiVersion: mocks.microcks.io/v1alpha1
kind: ArazzoSources
metadata:
  name: Order saga
  version: 1.0.0
sources:
  orderApi:
    name: Order API
    version: 1.0.0
  stockApi:
    name: Stock API
    version: 1.0.0
  paymentApi:
    name: Payment API
    version: 1.0.0
---
# example: order-saga-parallel - Order saga 1.1.0: reserveStock and chargePayment both depend on createOrder only, confirmOrder on every step before it
arazzo: 1.1.0
info:
  title: Order saga
  version: 1.1.0
sourceDescriptions:
  - name: orderApi
    url: ./order-api.yaml
    type: openapi
  - name: stockApi
    url: ./stock-api.yaml
    type: openapi
  - name: paymentApi
    url: ./payment-api.yaml
    type: openapi
workflows:
  - workflowId: placeOrderSaga
    summary: Places an order, reserves its items, charges it, then confirms it.
    inputs:
      type: object
      properties:
        customerId:
          type: string
    steps:
      - stepId: createOrder
        operationId: $sourceDescriptions.orderApi.createOrder
        requestBody:
          contentType: application/json
          payload:
            customerId: ""
            items:
              - sku: ABC-1
                quantity: 2
            amount: 25.0
            currency: EUR
          replacements:
            - target: /customerId
              value: $inputs.customerId
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          id: $response.body#/id
          amount: $response.body#/amount
      - stepId: reserveStock
        operationId: $sourceDescriptions.stockApi.reserveStock
        dependsOn:
          - createOrder
        requestBody:
          contentType: application/json
          payload:
            orderId: ""
            items:
              - sku: ABC-1
                quantity: 2
          replacements:
            - target: /orderId
              value: $steps.createOrder.outputs.id
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          reservationId: $response.body#/id
      - stepId: chargePayment
        operationId: $sourceDescriptions.paymentApi.chargePayment
        dependsOn:
          - createOrder
        requestBody:
          contentType: application/json
          payload:
            orderId: ""
            amount: 0
          replacements:
            - target: /orderId
              value: $steps.createOrder.outputs.id
            - target: /amount
              value: $steps.createOrder.outputs.amount
        successCriteria:
          - condition: $statusCode == 201
      - stepId: confirmOrder
        operationId: $sourceDescriptions.orderApi.confirmOrder
        parameters:
          - name: orderId
            in: path
            value: $steps.createOrder.outputs.id
        successCriteria:
          - condition: $statusCode == 200
    outputs:
      orderId: $steps.createOrder.outputs.id
      reservationId: $steps.reserveStock.outputs.reservationId
---
# example: order-saga-parallel-sources - links the sources of Order saga 1.1.0 to Order, Stock and Payment API 1.0.0
apiVersion: mocks.microcks.io/v1alpha1
kind: ArazzoSources
metadata:
  name: Order saga
  version: 1.1.0
sources:
  orderApi:
    name: Order API
    version: 1.0.0
  stockApi:
    name: Stock API
    version: 1.0.0
  paymentApi:
    name: Payment API
    version: 1.0.0
