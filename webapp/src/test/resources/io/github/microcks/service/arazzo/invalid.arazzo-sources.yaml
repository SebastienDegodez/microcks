# ArazzoSources overlays that name no Arazzo document. One YAML document per example.
# example: no-metadata - an overlay without the metadata that names its Arazzo document
apiVersion: mocks.microcks.io/v1alpha1
kind: ArazzoSources
sources:
  pastryApi:
    name: API Pastry - 2.0
    version: 2.0.0
---
# example: no-metadata-name - an overlay whose metadata has a version but no name
apiVersion: mocks.microcks.io/v1alpha1
kind: ArazzoSources
metadata:
  version: 1.0.0
sources:
  pastryApi:
    name: API Pastry - 2.0
    version: 2.0.0
---
# example: no-metadata-version - an overlay whose metadata has a name but no version
apiVersion: mocks.microcks.io/v1alpha1
kind: ArazzoSources
metadata:
  name: API Pastry scenarios
sources:
  pastryApi:
    name: API Pastry - 2.0
    version: 2.0.0
