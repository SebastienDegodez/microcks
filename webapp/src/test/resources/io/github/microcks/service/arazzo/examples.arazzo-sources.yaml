      inputs:
        pastry: Eclair Cafe
        newPrice: 2.6
      outputs:
        before: 2.5
        after: 2.6
    millefeuille-repriced:
      inputs:
        pastry: Millefeuille
        newPrice: 4.5
    eclair-without-price:
