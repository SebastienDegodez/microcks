  name: API Pastry scenarios
  version: 1.0.0
sources:
  pastryApi:
    name: API Pastry - 2.0
    version: 2.0.0
examples:
  readThenReprice:
    tartelette-repriced:
      inputs:
        pastry: Tartelette Fraise
        newPrice: 3
      steps:
        readPastry:
          outputs:
            price: 2.0
      outputs:
        before: 2.0
        after: 3
