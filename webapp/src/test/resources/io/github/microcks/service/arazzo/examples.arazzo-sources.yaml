# ArazzoSources overlays of API Pastry scenarios 1.0.0 recording examples of its workflows. One YAML document per example.
# example: recorded - the examples of readThenReprice and listThenReadFirst, with the link of pastryApi
apiVersion: mocks.microcks.io/v1alpha1
kind: ArazzoSources
metadata:
  name: API Pastry scenarios
  version: 1.0.0
sources:
  pastryApi:
    name: API Pastry - 2.0
    version: 2.0.0
examples:
  readThenReprice:
    eclair-repriced:
      inputs:
        pastry: Eclair Cafe
        newPrice: 2.6
      outputs:
        before: 2.5
        after: 2.6
    millefeuille-repriced:
      inputs:
        pastry: Millefeuille
        newPrice: 4.5
  listThenReadFirst:
    unknown-first-pastry:
      steps:
        list:
          status: 200
          outputs:
            first: Baba Rhum
        readFirst:
          status: 404
      stopsAt: readFirst
---
# example: missing-input - a third example of readThenReprice that gives no newPrice, which the workflow needs
