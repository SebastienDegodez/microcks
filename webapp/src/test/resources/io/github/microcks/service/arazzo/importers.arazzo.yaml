---
# example: journeys/order-fulfilment.arazzo-sources.yaml - the ArazzoSources overlay of Order fulfilment, kept next to it
apiVersion: mocks.microcks.io/v1alpha1
kind: ArazzoSources
metadata:
  name: Order fulfilment
  version: 1.0.0
sources:
  customerApi:
    name: Customer API
    version: 1.0.0
  orderApi:
    name: Order API
    version: 1.0.0
---
# example: one-source - a document with one source description, whose url is DECLARED_URL
arazzo: 1.0.1
info:
  title: Customer lookup
  version: 1.0.0
sourceDescriptions:
  - name: customerApi
    url: DECLARED_URL
    type: openapi
workflows:
  - workflowId: searchThenRead
    steps:
      - stepId: search
        operationId: SearchCustomers
        successCriteria:
          - condition: $statusCode == 200
---
# example: crossed-links - an ArazzoSources overlay of Order fulfilment that links both sources to Customer API
apiVersion: mocks.microcks.io/v1alpha1
kind: ArazzoSources
