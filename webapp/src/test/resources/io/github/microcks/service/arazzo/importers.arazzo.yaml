# example: journeys/place-order.arazzo.yaml - Order fulfilment, whose sources declare the URL of their contracts relative to the document
arazzo: 1.0.1
info:
  title: Order fulfilment
  version: 1.0.0
sourceDescriptions:
  - name: customerApi
    url: ../contracts/customers.yaml
    type: openapi
  - name: orderApi
    url: ./order-api.openapi.yaml
    type: openapi
workflows:
  - workflowId: searchThenRead
    summary: Searches customers by name, then reads the first one found.
    steps:
      - stepId: search
        operationId: $sourceDescriptions.customerApi.SearchCustomers
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          customerId: $response.body#/0/id
      - stepId: read
        operationId: $sourceDescriptions.customerApi.GetCustomer
        parameters:
          - name: id
            in: path
            value: $steps.search.outputs.customerId
        successCriteria:
          - condition: $statusCode == 200
  - workflowId: placeOrder
    summary: Places an order, then reads it back.
    steps:
      - stepId: createOrder
        operationId: $sourceDescriptions.orderApi.CreateOrder
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          orderId: $response.body#/id
      - stepId: readOrder
        operationId: $sourceDescriptions.orderApi.GetOrder
        parameters:
          - name: id
            in: path
            value: $steps.createOrder.outputs.orderId
        successCriteria:
          - condition: $statusCode == 200
---
# example: place-order-revised - Order fulfilment 1.0.0 as pushed later to the repository, with a third workflow
arazzo: 1.0.1
info:
  title: Order fulfilment
  version: 1.0.0
sourceDescriptions:
  - name: customerApi
    url: ../contracts/customers.yaml
    type: openapi
  - name: orderApi
    url: ./order-api.openapi.yaml
    type: openapi
workflows:
  - workflowId: searchThenRead
    steps:
      - stepId: search
        operationId: $sourceDescriptions.customerApi.SearchCustomers
        successCriteria:
          - condition: $statusCode == 200
  - workflowId: placeOrder
    steps:
      - stepId: createOrder
        operationId: $sourceDescriptions.orderApi.CreateOrder
        successCriteria:
          - condition: $statusCode == 201
  - workflowId: trackOrder
    steps:
      - stepId: readOrder
        operationId: $sourceDescriptions.orderApi.GetOrder
        successCriteria:
          - condition: $statusCode == 200
---
# example: unsupported-field - Order fulfilment 1.0.0 whose workflow uses successActions, outside of the supported subset
arazzo: 1.0.1
info:
  title: Order fulfilment
  version: 1.0.0
sourceDescriptions:
  - name: customerApi
    url: ../contracts/customers.yaml
    type: openapi
workflows:
  - workflowId: searchThenRead
    successActions:
      - name: done
        type: end
    steps:
      - stepId: search
        operationId: $sourceDescriptions.customerApi.SearchCustomers
---
# example: no-info - a document without info
arazzo: 1.0.1
sourceDescriptions:
  - name: customerApi
